AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Nianza foundation backend infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AdminEmail:
    Type: String
    Default: eja+nianza@banxito.com
    Description: Initial admin user email. Cognito sends this user a temporary password on stack creation.
  InitialAdminRole:
    Type: String
    Default: super_admin
    AllowedValues: [super_admin, content_editor, operations]
    Description: Application role assigned to the initial admin user.
  DeepgramApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Deepgram API key for mobile voice STT/TTS. Pass from a secure local variable at deploy time.
  DeepgramTtsModel:
    Type: String
    Default: aura-2-cordelia-en
    Description: Deepgram Aura voice model used for Patricia.
  DeepgramSttModel:
    Type: String
    Default: nova-2
    Description: Deepgram speech-to-text model for parent voice notes.
  AnthropicApiKeyParameterName:
    Type: String
    Default: /nianza/prod/anthropic/api-key
    Description: SSM SecureString parameter name that stores the Anthropic API key for Patricia chat.
  AnthropicModelParameterName:
    Type: String
    Default: /nianza/prod/anthropic/model
    Description: SSM String parameter name that stores the Patricia chat model id.
  PatriciaPromptBucket:
    Type: String
    Default: ""
    Description: Optional S3 bucket that stores the Patricia system prompt.
  PatriciaPromptKey:
    Type: String
    Default: en/grandmother-chat.txt
    Description: S3 object key for the Patricia system prompt.
  PatriciaTemperature:
    Type: String
    Default: "0.7"
    Description: Model temperature for Patricia chat.
  PatriciaMaxTokens:
    Type: String
    Default: "450"
    Description: Maximum tokens for a Patricia response.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Architectures: [arm64]
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Authorization,Content-Type'"
      AllowOrigin: "'*'"

Resources:
  MobileUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub nianza-mobile-${Environment}
      UserPoolTags:
        App: Nianza
        Env: !Ref Environment
        Owner: eja
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: parent_name
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: locale
          AttributeDataType: String
          Mutable: true
          Required: false

  MobileUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub nianza-mobile-app-${Environment}
      UserPoolId: !Ref MobileUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 90
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes:
        - email
        - custom:parent_name
        - locale
      WriteAttributes:
        - email
        - custom:parent_name
        - locale

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub nianza-admin-${Environment}
      UserPoolTags:
        App: Nianza
        Env: !Ref Environment
        Owner: eja
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: !Sub "Your Nianza ${Environment} admin account"
          EmailMessage: "Your Nianza admin username is {username} and your temporary password is {####}"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub nianza-admin-portal-${Environment}
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes:
        - email
        - custom:role
      WriteAttributes:
        - email

  InitialAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref AdminUserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: "true"
        - Name: custom:role
          Value: !Ref InitialAdminRole

  AdminApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub nianza-admin-api-${Environment}
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: AdminCognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          AdminCognitoAuthorizer:
            UserPoolArn: !GetAtt AdminUserPool.Arn
            Identity:
              Header: Authorization
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseTemplates:
            application/json: '{"error":"Unauthorized"}'
        ACCESS_DENIED:
          StatusCode: 403
          ResponseTemplates:
            application/json: '{"error":"Forbidden"}'

  MobileApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub nianza-mobile-api-${Environment}
      StageName: !Ref Environment
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          MobileCognitoAuthorizer:
            UserPoolArn: !GetAtt MobileUserPool.Arn
            Identity:
              Header: Authorization

  AdminAuditLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-admin-audit-log-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: adminUserId
          AttributeType: S
        - AttributeName: timestampActionId
          AttributeType: S
        - AttributeName: action
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: adminUserId
          KeyType: HASH
        - AttributeName: timestampActionId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: action-timestamp-index
          KeySchema:
            - AttributeName: action
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # NZA-ADMIN-v1.0 SS4.5: notification log. NOTE (Phase 0, July 2026): no
  # push-delivery infrastructure (SNS/Pinpoint/Expo push tokens) exists in
  # this backend yet, so this table currently logs broadcast ATTEMPTS (one
  # row per admin broadcast action) rather than per-user delivery receipts.
  # Real per-user delivery logging is a follow-on task once push is wired up.
  NotificationLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-notification-log-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: notificationType
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: notificationType
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE

  AdminSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub nianza-admin-sessions-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: adminUserId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: adminUserId
          KeyType: HASH
        - AttributeName: sessionId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ContentLibraryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-content-library-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: contentId
          AttributeType: S
        - AttributeName: version
          AttributeType: S
        - AttributeName: language
          AttributeType: S
        - AttributeName: contentType
          AttributeType: S
      KeySchema:
        - AttributeName: contentId
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: language-contentType-index
          KeySchema:
            - AttributeName: language
              KeyType: HASH
            - AttributeName: contentType
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  MobileUsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  MobileChildrenTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-children-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: childId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: childId
          KeyType: RANGE

  MilestoneProgressTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-milestone-progress-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: childId
          AttributeType: S
        - AttributeName: observedAt
          AttributeType: S
      KeySchema:
        - AttributeName: childId
          KeyType: HASH
        - AttributeName: observedAt
          KeyType: RANGE

  ImmunizationStatusTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-immunization-status-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: childId
          AttributeType: S
        - AttributeName: doseId
          AttributeType: S
      KeySchema:
        - AttributeName: childId
          KeyType: HASH
        - AttributeName: doseId
          KeyType: RANGE

  SickEncountersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-sick-encounters-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: childId
          AttributeType: S
        - AttributeName: encounterId
          AttributeType: S
      KeySchema:
        - AttributeName: childId
          KeyType: HASH
        - AttributeName: encounterId
          KeyType: RANGE

  VitalsLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-vitals-log-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: childId
          AttributeType: S
        - AttributeName: entryId
          AttributeType: S
      KeySchema:
        - AttributeName: childId
          KeyType: HASH
        - AttributeName: entryId
          KeyType: RANGE

  VisitDebriefsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-visit-debriefs-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: childId
          AttributeType: S
        - AttributeName: debriefId
          AttributeType: S
      KeySchema:
        - AttributeName: childId
          KeyType: HASH
        - AttributeName: debriefId
          KeyType: RANGE

  # N3 (child voice recordings) / N2 (parent voice capsules) -- one table for
  # both, distinguished by the `type` attribute. childMemoryId is
  # `${childId}#${memoryId}` so all of one child's voice memories are
  # contiguous under a userId partition.
  VoiceMemoriesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-voice-memories-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: childMemoryId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: childMemoryId
          KeyType: RANGE

  # No pre-existing bucket for mobile-uploaded media exists anywhere in this
  # stack (milestone/first photos are only ever stored as local device
  # URIs) -- this is a genuinely new bucket, not a reuse of something else.
  # NZA-ADMIN-v1.1 SS2.1: staging + live copies of the versioned schedule
  # files (vaccines/growth/milestones). NOTE: the three consuming Lambdas
  # (mobile/vaccines, mobile/milestones, mobile/vitals) still load their
  # data from a bundled JSON require() or a hardcoded constant, NOT from this
  # bucket -- migrating them to fetch from here at runtime is a follow-on
  # task. This bucket + the version-tracking table below give Ej a real place
  # to publish new versions and set sourceVerifiedBy; wiring the app-side
  # read path to actually honor it is tracked separately.
  ReferenceDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub nianza-reference-data-${Environment}-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja

  ReferenceDataVersionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-reference-data-versions-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: referenceKey
          AttributeType: S
      KeySchema:
        - AttributeName: referenceKey
          KeyType: HASH

  # NZA-ADMIN-v1.1 SS2.2 / NZA-CHAT-v1.0 SS5: golden-conversation harness
  # sign-off. NOTE: scripts/eval-patricia.js is the only harness that exists
  # today and covers 3 scenarios, not the 25 the spec calls for -- expanding
  # it to the full set is a follow-on content task, tracked separately from
  # this table/Lambda/UI, which are otherwise spec-complete.
  HarnessRunsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-admin-harness-runs-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: runId
          AttributeType: S
      KeySchema:
        - AttributeName: runId
          KeyType: HASH

  # NZA-ADMIN-v2 SS1 (Engagement): nightly rollup only -- never raw
  # per-parent event dumps. PK = date, SK = metric key (e.g. "dau",
  # "chatSessions", "newUsers"). NOTE: there is no dedicated event-tracking
  # pipeline in this app yet (no analytics SDK, no per-screen event
  # instrumentation) -- these rollups are computed from what already exists
  # (conversation sessions, user/child records), which gives a reasonable
  # DAU/session-count proxy but NOT true feature-adoption-per-screen data.
  # Building real event instrumentation is a separate, larger follow-on task.
  UsageAggregatesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-usage-aggregates-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: aggregateDate
          AttributeType: S
        - AttributeName: metricKey
          AttributeType: S
      KeySchema:
        - AttributeName: aggregateDate
          KeyType: HASH
        - AttributeName: metricKey
          KeyType: RANGE

  VoiceMemoriesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub nianza-voice-memories-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja

  MobileConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-conversations-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user-updatedAt-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  MobileReportsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-reports-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: childId
          AttributeType: S
        - AttributeName: reportId
          AttributeType: S
      KeySchema:
        - AttributeName: childId
          KeyType: HASH
        - AttributeName: reportId
          KeyType: RANGE

  # NZA-WEEKLY-LETTER-v1.0: letterId is the sole PK (deterministic --
  # weekly-letter#{childId}#{weekStartDateKey} -- see mobile/weekly-letters/
  # periods.js) rather than a childId+letterId composite, specifically so the
  # existing mobile client (getWeeklyLetter(letterId) / markWeeklyLetterRead
  # (letterId), no childId param) needs no route/UI changes for the detail
  # and mark-read routes. The childId-index GSI serves the list route.
  WeeklyLettersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-weekly-letters-${Environment}
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: letterId
          AttributeType: S
        - AttributeName: childId
          AttributeType: S
        - AttributeName: weekStartDate
          AttributeType: S
      KeySchema:
        - AttributeName: letterId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: childId-index
          KeySchema:
            - AttributeName: childId
              KeyType: HASH
            - AttributeName: weekStartDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AdminContentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub nianza-admin-content-${Environment}
      CodeUri: ../
      Handler: admin/content/handler.handler
      Environment:
        Variables:
          CONTENT_TABLE: !Ref ContentLibraryTable
          AUDIT_TABLE: !Ref AdminAuditLogTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ContentLibraryTable
        - DynamoDBWritePolicy:
            TableName: !Ref AdminAuditLogTable
      Events:
        ContentList:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /admin/v1/content
            Method: GET
        ContentCreate:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /admin/v1/content
            Method: POST
        ContentReview:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /admin/v1/content/{contentId}/review
            Method: POST
        ContentApprove:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /admin/v1/content/{contentId}/approve
            Method: POST
        ContentUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /admin/v1/content/{contentId}
            Method: PUT
        ContentDelete:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /admin/v1/content/{contentId}
            Method: DELETE

  AdminSsmFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub nianza-admin-ssm-${Environment}
      CodeUri: ../
      Handler: admin/ssm/handler.handler
      Environment:
        Variables:
          AUDIT_TABLE: !Ref AdminAuditLogTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref AdminAuditLogTable
        - Statement:
            # DescribeParameters is not resource-scopable in IAM (it filters
            # via ParameterFilters at the API level, not per-ARN) -- Resource
            # must be "*" here even though the handler only ever queries the
            # /nianza/ prefix.
            - Effect: Allow
              Action:
                - ssm:DescribeParameters
              Resource: "*"
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:PutParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nianza/*
      Events:
        SsmList:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
