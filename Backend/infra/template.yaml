  MobileChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub nianza-mobile-chat-${Environment}
      CodeUri: ../
      Handler: mobile/chat/handler.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          USERS_TABLE: !Ref MobileUsersTable
          CHILDREN_TABLE: !Ref MobileChildrenTable
          MILESTONES_TABLE: !Ref MilestoneProgressTable
          SICK_ENCOUNTERS_TABLE: !Ref SickEncountersTable
          VACCINES_TABLE: !Ref ImmunizationStatusTable
          VITALS_TABLE: !Ref VitalsLogTable
          CONTENT_TABLE: !Ref ContentLibraryTable
          CONVERSATIONS_TABLE: !Ref MobileConversationsTable
          ANTHROPIC_API_KEY_PARAMETER: !Ref AnthropicApiKeyParameterName
          ANTHROPIC_MODEL_PARAMETER: !Ref AnthropicModelParameterName
          PATRICIA_PROMPT_BUCKET: !Ref PatriciaPromptBucket
          PATRICIA_PROMPT_KEY: !Ref PatriciaPromptKey
          PATRICIA_TEMPERATURE: !Ref PatriciaTemperature
          PATRICIA_MAX_TOKENS: !Ref PatriciaMaxTokens
      Policies:
        # NZA-SUB-v1.0 Section 8.1: shared/entitlements.js's
        # recordPatriciaMessage() writes the daily message counter onto the
        # user's own row (patriciaMessageDate/patriciaMessageCount) --
        # upgraded from DynamoDBReadPolicy to DynamoDBCrudPolicy for that.
        - DynamoDBCrudPolicy:
            TableName: !Ref MobileUsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref MobileChildrenTable
        - DynamoDBReadPolicy:
            TableName: !Ref MilestoneProgressTable
        - DynamoDBReadPolicy:
            TableName: !Ref SickEncountersTable
        - DynamoDBReadPolicy:
            TableName: !Ref ImmunizationStatusTable
        - DynamoDBReadPolicy:
            TableName: !Ref VitalsLogTable
        - DynamoDBReadPolicy:
            TableName: !Ref ContentLibraryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MobileConversationsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: "*"
      Events:
        Chat:
          Type: Api
          Properties:
            RestApiId: !Ref MobileApi
            Path: /mobile/v1/chat
            Method: POST
            Auth:
              Authorizer: MobileCognitoAuthorizer

  # NZA-SUB-v1.0 Section 8.1: read-side of the capability service for the
  # mobile client (shared/entitlements.js is the actual source of truth,
  # imported directly by every backend handler that needs to gate
  # something -- this Lambda just exposes a read view of it over HTTP so
  # screens can decide what to show without duplicating the tier logic).
  MobileEntitlementsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub nianza-mobile-entitlements-${Environment}
      CodeUri: ../
      Handler: mobile/entitlements/handler.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          USERS_TABLE: !Ref MobileUsersTable
      Policies:
        # NZA-SUB-v1.0 Section 6/8.3 step 4: trial-notice/ack writes the
        # shown-at timestamp that keeps Day 10 / Day 14 to exactly one
        # showing each -- upgraded from read-only for that.
        - DynamoDBCrudPolicy:
            TableName: !Ref MobileUsersTable
      Events:
        GetEntitlements:
          Type: Api
          Properties:
            RestApiId: !Ref MobileApi
            Path: /mobile/v1/entitlements
            Method: GET
            Auth:
              Authorizer: MobileCognitoAuthorizer
        AckTrialNotice:
          Type: Api
          Properties:
            RestApiId: !Ref MobileApi
            Path: /mobile/v1/entitlements/trial-notice/ack
            Method: POST
            Auth:
              Authorizer: MobileCognitoAuthorizer

  MobileReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub nianza-mobile-reports-${Environment}
      CodeUri: ../
      Handler: mobile/reports/handler.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          CHILDREN_TABLE: !Ref MobileChildrenTable
          REPORTS_TABLE: !Ref MobileReportsTable
          VITALS_TABLE: !Ref VitalsLogTable
          MILESTONES_TABLE: !Ref MilestoneProgressTable
          SICK_ENCOUNTERS_TABLE: !Ref SickEncountersTable
          VACCINES_TABLE: !Ref ImmunizationStatusTable
          VISIT_DEBRIEFS_TABLE: !Ref VisitDebriefsTable
          # NZA-SUB-v1.0 Section 5: shared/entitlements.js's getEntitlements()
          # gates Doctor Visit Pack / Progress Reports here -- read-only.
          USERS_TABLE: !Ref MobileUsersTable
          ANTHROPIC_API_KEY_PARAMETER: !Ref AnthropicApiKeyParameterName
          ANTHROPIC_MODEL_PARAMETER: !Ref AnthropicModelParameterName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MobileChildrenTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MobileReportsTable
        - DynamoDBReadPolicy:
            TableName: !Ref VitalsLogTable
        - DynamoDBReadPolicy:
            TableName: !Ref MilestoneProgressTable
        - DynamoDBReadPolicy:
            TableName: !Ref SickEncountersTable
        - DynamoDBReadPolicy:
            TableName: !Ref ImmunizationStatusTable
        - DynamoDBReadPolicy:
            TableName: !Ref VisitDebriefsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MobileUsersTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: "*"
      Events:
        ReportsList:
          Type: Api
          Properties:
            RestApiId: !Ref MobileApi
            Path: /mobile/v1/reports/{childId}
            Method: GET
            Auth:
              Authorizer: MobileCognitoAuthorizer
        ReportsCreate:
          Type: Api
          Properties:
            RestApiId: !Ref MobileApi
            Path: /mobile/v1/reports/{childId}
            Method: POST
            Auth:
              Authorizer: MobileCognitoAuthorizer
        ReportGet:
          Type: Api
          Properties:
            RestApiId: !Ref MobileApi
            Path: /mobile/v1/reports/{childId}/{reportId}
            Method: GET
            Auth:
              Authorizer: MobileCognitoAuthorizer

  # NZA-WEEKLY-LETTER-v1.0 Phase 1: generation-only, no email send yet (see
  # docs/NZA-WEEKLY-LETTER-v1.0-spec.md's Phase 2). Tier-gated the same as
  # MobileReportsFunction above -- product decision 2026-08-01 overrode
  # Addendum A's free-for-everyone recommendation.
  MobileWeeklyLettersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub nianza-mobile-weekly-letters-${Environment}
      CodeUri: ../
      Handler: mobile/weekly-letters/handler.handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          CHILDREN_TABLE: !Ref MobileChildrenTable
          LETTERS_TABLE: !Ref WeeklyLettersTable
          LETTERS_TABLE_CHILD_INDEX: childId-index
          VITALS_TABLE: !Ref VitalsLogTable
          MILESTONES_TABLE: !Ref MilestoneProgressTable
          SICK_ENCOUNTERS_TABLE: !Ref SickEncountersTable
          VACCINES_TABLE: !Ref ImmunizationStatusTable
          USERS_TABLE: !Ref MobileUsersTable
          ANTHROPIC_API_KEY_PARAMETER: !Ref AnthropicApiKeyParameterName
          ANTHROPIC_MODEL_PARAMETER: !Ref AnthropicModelParameterName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MobileChildrenTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeeklyLettersTable
        - DynamoDBReadPolicy:
            TableName: !Ref VitalsLogTable
        - DynamoDBReadPolicy:
            TableName: !Ref MilestoneProgressTable
        - DynamoDBReadPolicy:
            TableName: !Ref SickEncountersTable
        - DynamoDBReadPolicy:
            TableName: !Ref ImmunizationStatusTable
        - DynamoDBReadPolicy:
            TableName: !Ref MobileUsersTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: "*"
      Events:
        WeeklyLettersList:
          Type: Api
          Properties:
            RestApiId: !Ref MobileApi
            Path: /mobile/v1/weekly-letters/by-child/{childId}
            Method: GET
            Auth:
              Authorizer: MobileCognitoAuthorizer
        WeeklyLetterGet:
          Type: Api
          Properties:
            RestApiId: !Ref MobileApi
            Path: /mobile/v1/weekly-letters/{letterId}
            Method: GET
            Auth:
              Authorizer: MobileCognitoAuthorizer
        WeeklyLetterMarkRead:
          Type: Api
          Properties:
            RestApiId: !Ref MobileApi
            Path: /mobile/v1/weekly-letters/{letterId}/read
            Method: POST
            Auth:
              Authorizer: MobileCognitoAuthorizer
        WeeklyLetterFanOut:
          Type: Schedule
          Properties:
            Schedule: "cron(0 22 ? * SUN *)" # 6pm US Eastern (22:00 UTC) Sunday -- EDT/EST drift is a known limitation, see spec
            Description: Weekly Patricia letter generation, once per child per Sunday
            Enabled: true

  # ─── NZA-ADMIN-v1.1 P0.1: Real Billing (RevenueCat) ──────────────────────
  # Secrets, storage, and three Lambdas: the public webhook receiver
  # (nianza-billing-lambda), the nightly reconciliation job
  # (nianza-billing-reconcile), and the admin-facing read endpoints
  # (AdminBillingFunction). See Backend/billing/*/handler.js and
  # Backend/admin/billing/handler.js for the code; see
  # IMPLEMENTATION-NOTES.md for deviations from the spec's literal naming.

  RevenueCatWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub nianza/revenuecat/webhook-secret-${Environment}
      Description: Shared secret RevenueCat must send as the Authorization header on every webhook POST. We generate it; paste this value into RevenueCat's webhook config (Project Settings > Integrations > Webhooks > Authorization header value).
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: value
        PasswordLength: 40
        ExcludePunctuation: true

  RevenueCatApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub nianza/revenuecat/api-key-${Environment}
      Description: RevenueCat REST API key (Secret API key, not Public). Needed for nianza-billing-reconcile and Phase 3 admin actions. CloudFormation cannot know RevenueCat's real key -- replace this placeholder in Secrets Manager console after connecting a live RevenueCat project.
      SecretString: "REPLACE_ME_MANUALLY_IN_CONSOLE"

  BillingRawBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub nianza-billing-raw-${Environment}-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja

  BillingEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub nianza-billing-events-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: App
          Value: Nianza
        - Key: Env
          Value: !Ref Environment
        - Key: Owner
          Value: eja
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: eventTimestampEventId
          AttributeType: S
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: eventTimestamp
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: eventTimestampEventId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: eventType-eventTimestamp-index
          KeySchema:
            - AttributeName: eventType
              KeyType: HASH
            - AttributeName: eventTimestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  BillingWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub nianza-billing-webhook-${Environment}
      CodeUri: ../
      Handler: billing/webhook/handler.handler
      Timeout: 15
      Environment:
        Variables:
          BILLING_EVENTS_TABLE: !Ref BillingEventsTable
          USERS_TABLE: !Ref MobileUsersTable
          BILLING_RAW_BUCKET: !Ref BillingRawBucket
          WEBHOOK_SECRET_ARN: !Ref RevenueCatWebhookSecret
          BILLING_CACHE_PARAM: !Sub /nianza/admin/billing-summary-cache-${Environment}
          # Updated Aug 3 2026: real App Store Connect subscriptions now exist
          # for the "Nianza (App Store)" app in RevenueCat (App Store Connect
          # created them; RevenueCat products/offering wired up the same day
          # -- see app.revenuecat.com/projects/86547d89/product-catalog/products).
          # Apple product ids are "nianza_premium_monthly" /
          # "nianza_premium_yearly", not the old Test Store-only "monthly" /
          # "yearly" ids. Both the App Store and Test Store products are
          # attached to the same "NIanza Pro" entitlement and both are in the
          # "default" offering's packages, so this only needs to change if the
          # products are ever recreated with different ids.
          REVENUECAT_MONTHLY_PRODUCT_ID: nianza_premium_monthly
          REVENUECAT_ANNUAL_PRODUCT_ID: nianza_premium_yearly
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BillingEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MobileUsersTable
        - S3CrudPolicy:
            BucketName: !Ref BillingRawBucket
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref RevenueCatWebhookSecret
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nianza/admin/billing-summary-cache-${Environment}
      Events:
        RevenueCatWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/webhooks/revenuecat
            Method: POST
            Auth:
              Authorizer: NONE

  BillingReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub nianza-billing-reconcile-${Environment}
      CodeUri: ../
      Handler: billing/reconcile/handler.handler
      Timeout: 120
      Environment:
        Variables:
          USERS_TABLE: !Ref MobileUsersTable
          BILLING_EVENTS_TABLE: !Ref BillingEventsTable
          REVENUECAT_API_KEY_SECRET_ARN: !Ref RevenueCatApiKeySecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MobileUsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BillingEventsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref RevenueCatApiKeySecret
      Events:
        NightlyReconcile:
          Type: Schedule
          Properties:
            Schedule: "cron(0 8 * * ? *)" # ~03:00-04:00 ET depending on DST
            Description: Nightly RevenueCat subscriber-API reconciliation against our billing snapshot
            Enabled: true

  AdminBillingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub nianza-admin-billing-${Environment}
      CodeUri: ../
      Handler: admin/billing/handler.handler
      Environment:
        Variables:
          USERS_TABLE: !Ref MobileUsersTable
          BILLING_EVENTS_TABLE: !Ref BillingEventsTable
          BILLING_CACHE_PARAM: !Sub /nianza/admin/billing-summary-cache-${Environment}
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MobileUsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref BillingEventsTable
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nianza/admin/billing-summary-cache-${Environment}
      Events:
        BillingSummary:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /admin/v1/billing/summary
            Method: GET
        BillingEvents:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /admin/v1/billing/events
            Method: GET
        BillingFailedPayments:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /admin/v1/billing/failed-payments
            Method: GET

Outputs:
  AdminApiUrl:
    Value: !Sub https://${AdminApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/admin/v1
  MobileApiUrl:
    Value: !Sub https://${MobileApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/mobile/v1
  MobileUserPoolId:
    Value: !Ref MobileUserPool
  MobileUserPoolClientId:
    Value: !Ref MobileUserPoolClient
  MobileUserPoolArn:
    Value: !GetAtt MobileUserPool.Arn
  AdminUserPoolId:
    Value: !Ref AdminUserPool
  AdminUserPoolClientId:
    Value: !Ref AdminUserPoolClient
  AdminUserPoolArn:
    Value: !GetAtt AdminUserPool.Arn
  InitialAdminEmail:
    Value: !Ref AdminEmail
  AdminAuditLogTableName:
    Value: !Ref AdminAuditLogTable
  AdminSessionsTableName:
    Value: !Ref AdminSessionsTable
  ContentLibraryTableName:
    Value: !Ref ContentLibraryTable
  MobileUsersTableName:
    Value: !Ref MobileUsersTable
  MobileChildrenTableName:
    Value: !Ref MobileChildrenTable
  MilestoneProgressTableName:
    Value: !Ref MilestoneProgressTable
  ImmunizationStatusTableName:
    Value: !Ref ImmunizationStatusTable
  SickEncountersTableName:
    Value: !Ref SickEncountersTable
  VitalsLogTableName:
    Value: !Ref VitalsLogTable
  MobileConversationsTableName:
    Value: !Ref MobileConversationsTable
  MobileReportsTableName:
    Value: !Ref MobileReportsTable
  WeeklyLettersTableName:
    Value: !Ref WeeklyLettersTable
  BillingEventsTableName:
    Value: !Ref BillingEventsTable
  BillingRawBucketName:
    Value: !Ref BillingRawBucket
  RevenueCatWebhookSecretArn:
    Value: !Ref RevenueCatWebhookSecret
  RevenueCatApiKeySecretArn:
    Value: !Ref RevenueCatApiKeySecret
  RevenueCatWebhookUrl:
    Value: !Sub https://${AdminApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/v1/webhooks/revenuecat
